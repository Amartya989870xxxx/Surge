    - {key: checkout_code_change, app: github, source_type: code_change, record_id: "4411:changes"}
  relevant_evidence:
    - {app: github, source_type: deployment}
    - {app: sheets, source_type: funnel_analysis}
    - {app: sheets, source_type: tracking_consistency}
    - {app: sheets, source_type: error_rate_analysis}
    - {app: sheets, source_type: traffic_mix}
    - {app: slack, source_type: message}
  expected_action: create_github_issue
  approval_required: true
  expect_verified: true
